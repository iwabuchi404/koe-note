[project]
name = "kotoba-whisper-server"
version = "0.1.0"
description = "Local Kotoba-Whisper transcription server for voise-encoder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "asyncio-mqtt>=0.11.0",
    "pyinstaller>=6.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
